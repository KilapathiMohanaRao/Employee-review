server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: employee-360-backend
  profiles:
    active: default
  datasource:
    url: jdbc:h2:file:./data/employee360db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
  main:
    allow-bean-definition-overriding: true

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  frontend:
    url: ${APP_BASE_URL:http://localhost:5173}
  mail:
    from: ${EMAIL_FROM:${SMTP_USER:kilaparthimohan27@gmail.com}}
    from-name: ${EMAIL_FROM_NAME:Mohan Kilaparthi}
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  calculation:
    blind-spot-threshold: 0.5
    hidden-strength-threshold: -0.5
    min-feedback-count: 2

logging:
  level:
    root: INFO
    com.employee360: DEBUG
    org.springframework.security: INFO
